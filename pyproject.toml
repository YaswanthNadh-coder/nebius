[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timemachine"
version = "2.0.0"
description = "SQL Migration Dry-Run Time Machine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50.0",
    "Faker>=30.0.0",
    "streamlit>=1.39.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.0.0",
    "sqlglot>=20.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "F401",  # imported but unused (common in re-exports and stubs)
    "UP007", # Use `X | Y` for type annotations
    "E722",  # do not use bare 'except'
    "E741",  # ambiguous variable name
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
